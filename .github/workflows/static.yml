name: Testar e publicar MAS CRM
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testes do CRM
        run: |
          node --check app.js
          node --test tests/core.test.cjs tests/session.test.cjs tests/employees.test.mjs tests/employee-ui.test.cjs tests/operations.test.cjs
          python3 tests/csv_roundtrip.py
      - name: Preparar frontend
        run: |
          mkdir _site
          cp index.html styles.css app.js config.js .nojekyll manifest.webmanifest _site/
          mkdir -p _site/icons
          cp icons/mas-crm.svg _site/icons/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
